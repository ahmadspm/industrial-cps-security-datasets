[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aoa-research-prototype"
version = "0.2.0"
description = "LLM-ready bounded reconnaissance agent for a smart-factory Digital Twin"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "pydantic>=2.7,<3",
  "openai>=1.40,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
