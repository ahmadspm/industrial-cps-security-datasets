name: smart-factory-wire-twin

services:
  broker-init:
    image: eclipse-mosquitto:2
    restart: "no"
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    volumes:
      - ./mosquitto/bootstrap:/bootstrap:ro
      - mosquitto_config:/generated
    secrets:
      - mqtt_gateway_password
      - mqtt_twin_password
      - mqtt_txt_password

  mqtt-broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    depends_on:
      broker-init:
        condition: service_completed_successfully
    command: ["mosquitto", "-c", "/generated/mosquitto.conf"]
    volumes:
      - mosquitto_config:/generated:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    secrets:
      - mqtt_gateway_password
    networks: [factory_ot]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u gateway -P $$(cat /run/secrets/mqtt_gateway_password) -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s

  plc-opcua:
    build: ./services
    command: ["python", "-m", "app.plc_server"]
    restart: unless-stopped
    networks: [factory_ot]
    healthcheck:
      test: ["CMD", "python", "-m", "app.health", "plc-opcua", "4840"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  iot-gateway:
    build: ./services
    command: ["python", "-m", "app.gateway"]
    restart: unless-stopped
    depends_on:
      mqtt-broker:
        condition: service_healthy
      plc-opcua:
        condition: service_healthy
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_USERNAME: gateway
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_gateway_password
      OPCUA_ENDPOINT: opc.tcp://plc-opcua:4840/factory/server/
    secrets: [mqtt_gateway_password]
    networks: [factory_ot]

  txt-controller:
    build: ./services
    command: ["python", "-m", "app.txt_publisher"]
    restart: "no"
    depends_on:
      mqtt-broker:
        condition: service_healthy
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_USERNAME: txt
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_txt_password
    secrets: [mqtt_txt_password]
    networks: [factory_ot]

  digital-twin:
    build: ./services
    command: ["python", "-m", "app.twin_subscriber"]
    restart: unless-stopped
    depends_on:
      mqtt-broker:
        condition: service_healthy
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_USERNAME: twin
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_twin_password
      EVIDENCE_PATH: /evidence/twin-observations.jsonl
    secrets: [mqtt_twin_password]
    volumes:
      - ./evidence:/evidence
    networks: [factory_ot]

networks:
  factory_ot:
    internal: true

volumes:
  mosquitto_config:
  mosquitto_data:
  mosquitto_log:

secrets:
  mqtt_gateway_password:
    file: ./.secrets/mqtt_gateway_password.txt
  mqtt_twin_password:
    file: ./.secrets/mqtt_twin_password.txt
  mqtt_txt_password:
    file: ./.secrets/mqtt_txt_password.txt
