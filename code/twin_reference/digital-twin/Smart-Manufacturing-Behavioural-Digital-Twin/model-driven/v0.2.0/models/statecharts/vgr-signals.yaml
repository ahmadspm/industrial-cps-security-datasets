schema: smart-factory-dt.signal-catalogue/1.0
component: VGR
model: vgr.scxml
signals:
  commands:
    - {id: command.start, type: event, safety: operator-authorised}
    - {id: command.pick, type: event, safety: simulated-only}
    - {id: command.stop, type: event, safety: safe-stop}
    - {id: command.reset, type: event, safety: operator-authorised}
    - {id: command.acknowledge, type: event, safety: operator-authorised}
  sensors:
    - {id: sensor.x_reference, type: boolean, unit: "1", source: limit-switch}
    - {id: sensor.z_reference, type: boolean, unit: "1", source: limit-switch}
    - {id: sensor.rotation_reference, type: boolean, unit: "1", source: limit-switch}
    - {id: sensor.pick_height, type: boolean, unit: "1", source: calibrated-position}
    - {id: sensor.place_height, type: boolean, unit: "1", source: calibrated-position}
    - {id: sensor.target_rotation, type: boolean, unit: "1", source: calibrated-position}
    - {id: sensor.vacuum_detected, type: boolean, unit: "1", source: vacuum-feedback}
    - {id: sensor.vacuum_released, type: boolean, unit: "1", source: vacuum-feedback}
  actuators:
    - {id: VGR.axis_x.reverse, type: boolean, unit: "1"}
    - {id: VGR.axis_z.up, type: boolean, unit: "1"}
    - {id: VGR.axis_z.down, type: boolean, unit: "1"}
    - {id: VGR.axis_r.clockwise, type: boolean, unit: "1"}
    - {id: VGR.axis_r.counterclockwise, type: boolean, unit: "1"}
    - {id: VGR.vacuum.on, type: boolean, unit: "1"}
    - {id: VGR.vacuum.off, type: boolean, unit: "1"}
    - {id: VGR.all.stop, type: boolean, unit: "1"}
    - {id: VGR.safe_stop, type: boolean, unit: "1"}
assumptions:
  - Calibrated position events abstract encoder or PLC position evaluation.
  - PWM values and physical coordinates require the purchased factory calibration data.
  - Physical writes are disabled; all command scenarios are simulated.

